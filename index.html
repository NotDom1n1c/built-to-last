<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steadfast | Built to last.</title>
<meta name="description" content="Enterprise-grade stability for teams that cannot afford surprises.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* All that is left of the website. */
  .gone {
    position: fixed; left: 50%; bottom: max(26px, 4vh); transform: translate(-50%, 8px); z-index: 2;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px;
    width: max-content; max-width: calc(100vw - 32px);
    font: 400 15px/1.3 Inter, system-ui, sans-serif; color: #a8a49c; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .9s ease, transform .9s ease;
  }
  body.empty .gone { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .gone button {
    appearance: none; font: 600 15px/1 Inter, system-ui, sans-serif; cursor: pointer;
    padding: 11px 20px; border-radius: 6px; border: 1px solid #5c5850; background: #fff; color: #111;
  }
  .gone button.quiet { background: transparent; color: #cfcbc2; font-weight: 500; }
  .gone button:hover { filter: brightness(.88); }
  .gone button:focus-visible { outline: 2px solid #ffb35c; outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A corporate website that is pulled apart by a black hole growing out of the period in its own headline."></canvas>
<h1 class="sr">Built to last.</h1>
<div class="gone" aria-live="polite">
  <span>404. This page no longer exists.</span>
  <button id="undo">Undo</button>
  <button id="sound" class="quiet" aria-pressed="false">Sound off</button>
</div>
<script src="app.js?v=4"></script>
</body>
</html>
